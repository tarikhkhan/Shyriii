<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Everything 💖</title>
    <style>
        :root {
            --pink-main: #ff4d6d;
            --pink-shadow: #ffb3c1;
            --bg-color: #fff0f3;
            --text-black: #1a1a1a;
            --sparkle-pink: #ff0055;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            overflow: hidden; touch-action: none; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

        #content-layer {
            position: relative; z-index: 10; width: 85vw; max-width: 1000px;
            text-align: center; pointer-events: none; padding: 20px; box-sizing: border-box;
        }

        #message-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }

        .word-wrapper { display: inline-block; white-space: nowrap; }

        .letter {
            display: inline-block; opacity: 0; transform: scale(0);
            color: var(--text-black); font-size: clamp(1.5rem, 6.5vw, 3.8rem);
            font-weight: 900; text-shadow: 2.5px 2.5px 0px var(--pink-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter.reveal { opacity: 1; transform: scale(1); }

        #signature {
            position: fixed; bottom: 30px; right: 30px; z-index: 25;
            font-size: 2rem; font-weight: 900; opacity: 0; visibility: hidden;
            transition: opacity 1.5s ease; font-family: 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(90deg, var(--pink-main), #fff, var(--sparkle-pink));
            background-size: 200% auto; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 5px var(--pink-shadow));
        }

        #signature.show { opacity: 1; visibility: visible; animation: pinkShine 3s linear infinite, bounce 2s infinite alternate; }

        #music-control {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.5); border: none; border-radius: 50%;
            width: 40px; height: 40px; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes pinkShine { to { background-position: 200% center; } }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes glow { from { text-shadow: 2px 2px 0px var(--pink-shadow); } to { text-shadow: 0px 0px 15px var(--pink-main), 2px 2px 0px var(--pink-shadow); } }
        .finished .letter { animation: glow 2s ease-in-out infinite alternate; }

        #hint { position: fixed; bottom: 5%; left: 0; width: 100%; text-align: center; color: var(--pink-main); font-weight: bold; font-size: 0.9rem; z-index: 20; pointer-events: none; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="music-control">🎵</button>
    <canvas id="heartCanvas"></canvas>
    <div id="content-layer"><div id="message-container"></div></div>
    <div id="signature">Aiman💗</div>
    <div id="hint">Tap 22 times for a surprise...</div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('message-container');
        const hint = document.getElementById('hint');
        const signature = document.getElementById('signature');
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('music-control');

        let particles = [];
        let clicks = 0;
        let animationStarted = false;
        let musicStarted = false;
        const targetClicks = 22;
        const textMessage = "You are my everything and you are very special for me💗";
        const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a', '#ffb3c1'];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Heart {
            constructor(x, y, isFinalBurst) {
                this.x = x; this.y = y;
                const speedMult = isFinalBurst ? 18 : 11;
                this.vx = (Math.random() - 0.5) * speedMult; 
                this.vy = (Math.random() - 0.5) * speedMult;
                this.size = Math.random() * 10 + 20;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = 1; this.friction = 0.98; 
            }
            update() { this.vx *= this.friction; this.vy *= this.friction; this.x += this.vx; this.y += this.vy; this.opacity -= 0.007; }
            draw() { ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color; ctx.font = `${this.size}px serif`; ctx.fillText('❤', this.x, this.y); }
        }

        function fadeInMusic() {
            audio.volume = 0;
            audio.play();
            let vol = 0;
            const interval = setInterval(() => {
                if (vol < 0.9) {
                    vol += 0.05;
                    audio.volume = vol;
                } else {
                    clearInterval(interval);
                }
            }, 200);
        }

        function handleInteraction(x, y) {
            if (!musicStarted) {
                fadeInMusic();
                musicStarted = true;
            }
            for(let i=0; i<18; i++) particles.push(new Heart(x, y, false));
            if (!animationStarted) {
                clicks++;
                if (clicks === targetClicks) {
                    animationStarted = true;
                    hint.style.display = 'none';
                    startTyping();
                } else {
                    hint.innerText = `${targetClicks - clicks} heartbeats to go...`;
                }
            }
        }

        window.addEventListener('mousedown', (e) => handleInteraction(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleInteraction(touch.clientX, touch.clientY);
        }, { passive: false });

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) { audio.play(); musicBtn.innerText = "🎵"; }
            else { audio.pause(); musicBtn.innerText = "🔇"; }
        });

        function startTyping() {
            const words = textMessage.split(" ");
            let globalCharIndex = 0;
            words.forEach((wordText, wordIndex) => {
                const wordWrapper = document.createElement('div');
                wordWrapper.className = 'word-wrapper';
                container.appendChild(wordWrapper);
                const chars = Array.from(wordText);
                chars.forEach((char) => {
                    const span = document.createElement('span');
                    span.innerText = char; span.className = 'letter';
                    wordWrapper.appendChild(span);
                    setTimeout(() => {
                        span.classList.add('reveal');
                        if(globalCharIndex % 6 === 0) autoBurst();
                    }, globalCharIndex * 200);
                    globalCharIndex++;
                });
                if (wordIndex < words.length - 1) globalCharIndex++; 
            });
            setTimeout(() => {
                container.classList.add('finished');
                signature.classList.add('show');
                for(let j=0; j<180; j++) particles.push(new Heart(window.innerWidth/2, window.innerHeight/2, true));
            }, globalCharIndex * 200);
        }

        function autoBurst() {
            const rx = Math.random() * canvas.width;
            const ry = Math.random() * canvas.height;
            for(let i=0; i<4; i++) particles.push(new Heart(rx, ry, false));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                if(particles[i].opacity <= 0) { particles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
